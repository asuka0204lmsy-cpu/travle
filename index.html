<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>广州顺德食行地图</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #697586;
      --paper: #fffdf8;
      --line: rgba(31, 41, 51, .12);
      --shadow: 0 20px 55px rgba(31, 41, 51, .18);
      --red: #ef4e5d;
      --amber: #f59e0b;
      --green: #179b72;
      --blue: #3478f6;
      --violet: #7957d5;
      --brown: #8b5e3c;
      --water: #b9daf5;
      --park: #d7ead7;
      --road: #fff8e7;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #e8ecdf;
      overflow-x: hidden;
    }
    button { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }

    .phone {
      width: min(100%, 900px);
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: #edf1e7;
    }

    .map {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(26deg, transparent 0 17%, rgba(255,255,255,.7) 17.2% 18.1%, transparent 18.3%),
        linear-gradient(96deg, transparent 0 38%, rgba(255,255,255,.74) 38.2% 39.4%, transparent 39.6%),
        linear-gradient(146deg, transparent 0 57%, rgba(255,255,255,.78) 57.3% 58.4%, transparent 58.6%),
        linear-gradient(62deg, transparent 0 66%, rgba(255,255,255,.68) 66.1% 67.1%, transparent 67.4%),
        #edf1e7;
    }

    .map::before {
      content: "";
      position: absolute;
      inset: -5%;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(215,234,215,.95) 0 13%, transparent 13.4%),
        radial-gradient(ellipse at 82% 33%, rgba(215,234,215,.82) 0 11%, transparent 11.4%),
        radial-gradient(ellipse at 70% 80%, rgba(215,234,215,.78) 0 15%, transparent 15.4%),
        linear-gradient(115deg, transparent 0 39%, rgba(185,218,245,.92) 39.2% 45%, transparent 45.2%);
      filter: saturate(1.02);
    }

    .road {
      position: absolute;
      height: var(--h, 10px);
      width: var(--w);
      left: var(--x);
      top: var(--y);
      transform: rotate(var(--r));
      border-radius: 999px;
      background: var(--road);
      border: 1px solid rgba(211, 186, 133, .36);
      box-shadow: 0 1px 0 rgba(255,255,255,.7);
    }
    .road.major { --h: 16px; background: #fff3c4; border-color: rgba(208,165,57,.4); }
    .metro {
      position: absolute;
      height: 5px;
      width: var(--w);
      left: var(--x);
      top: var(--y);
      transform: rotate(var(--r));
      border-radius: 999px;
      background: var(--c);
      box-shadow: 0 2px 8px rgba(0,0,0,.16);
    }
    .metro::after {
      content: attr(data-name);
      position: absolute;
      left: 50%;
      top: -23px;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.86);
      color: #53606f;
      font-size: 10px;
      font-weight: 800;
    }
    .route {
      position: absolute;
      z-index: 3;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: 3px;
      transform: rotate(var(--r));
      transform-origin: left center;
      border-radius: 999px;
      background: rgba(52, 120, 246, .5);
      box-shadow: 0 0 0 4px rgba(52, 120, 246, .09);
      pointer-events: none;
    }
    .route::after {
      content: attr(data-label);
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 999px;
      color: #25313e;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(52, 120, 246, .18);
      font-size: 10px;
      font-weight: 950;
    }

    .topbar {
      position: fixed;
      z-index: 50;
      left: 50%;
      top: max(10px, env(safe-area-inset-top));
      transform: translateX(-50%);
      width: min(calc(100% - 20px), 880px);
      display: grid;
      gap: 10px;
      pointer-events: none;
    }
    .glass {
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.82);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(22px) saturate(1.25);
      box-shadow: 0 12px 36px rgba(31,41,51,.16);
    }
    .trip-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 22px;
    }
    .trip-title b { display: block; font-size: 16px; line-height: 1.15; }
    .trip-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 750; }
    .flight-mini {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .flight-mini span {
      padding: 5px 7px;
      border-radius: 999px;
      color: #fff;
      background: #25313e;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      padding: 5px;
      border-radius: 18px;
    }
    .tab {
      height: 38px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: #53606f;
      font-size: 13px;
      font-weight: 900;
    }
    .tab.active { color: #fff; background: #25313e; }

    .layer { display: none; position: absolute; inset: 0; }
    .layer.active { display: block; }

    .label {
      position: absolute;
      z-index: 4;
      left: var(--x);
      top: var(--y);
      color: rgba(31,41,51,.36);
      font-size: clamp(24px, 10vw, 62px);
      font-weight: 950;
      letter-spacing: 0;
      white-space: nowrap;
      transform: translate(-50%, -50%) rotate(var(--r, 0deg));
      pointer-events: none;
    }

    .pin {
      position: absolute;
      z-index: 8;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      display: inline-grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      width: var(--w, 150px);
      min-height: 46px;
      padding: 7px 9px;
      border: 0;
      border-radius: 18px;
      background: rgba(255,255,255,.93);
      box-shadow: 0 10px 26px rgba(31,41,51,.18);
      text-align: left;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }
    .pin.active {
      z-index: 12;
      transform: translate(-50%, -56%) scale(1.08);
      box-shadow: 0 18px 38px rgba(31,41,51,.25);
    }
    .pin.dim { opacity: .22; }
    .pin.filter-hidden { display: none; }
    .pin .icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 12px;
      color: #fff;
      background: var(--c);
      font-size: 16px;
    }
    .pin b, .pin span {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .pin b { font-size: 12px; line-height: 1.15; }
    .pin span { margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 760; }
    .pin.hotel { background: #25313e; color: #fff; }
    .pin.hotel span { color: rgba(255,255,255,.74); }
    .pin.anchor {
      z-index: 18;
      width: var(--w, 132px);
      border: 2px solid rgba(255,255,255,.95);
      box-shadow: 0 16px 36px rgba(31,41,51,.28);
    }
    .pin.anchor::after {
      content: "固定";
      position: absolute;
      right: 7px;
      top: -9px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #25313e;
      color: #fff;
      font-size: 9px;
      font-weight: 950;
    }
    .pin.dot {
      grid-template-columns: 30px;
      width: 44px;
      min-height: 44px;
      padding: 7px;
      border-radius: 999px;
    }
    .pin.dot > span:last-child { display: none; }
    .pin.dot.active,
    .pin.dot.anchor {
      grid-template-columns: 30px minmax(0, 1fr);
      width: var(--w, 150px);
      border-radius: 18px;
    }
    .pin.dot.active > span:last-child,
    .pin.dot.anchor > span:last-child {
      display: block;
    }

    .filters {
      position: fixed;
      z-index: 45;
      left: 50%;
      top: 132px;
      transform: translateX(-50%);
      width: min(100%, 900px);
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 0 72px 10px 12px;
      scrollbar-width: none;
      pointer-events: none;
      scroll-snap-type: x proximity;
      mask-image: linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 54px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 54px), transparent);
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      pointer-events: auto;
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 8px 22px rgba(31,41,51,.12);
      color: #53606f;
      font-size: 12px;
      font-weight: 900;
      scroll-snap-align: start;
      white-space: nowrap;
    }
    .filter.active { color: #fff; background: var(--active-color, #25313e); border-color: transparent; }

    .drawer {
      position: fixed;
      z-index: 55;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(calc(100% - 20px), 880px);
      display: grid;
      gap: 10px;
      pointer-events: none;
    }
    .place-card {
      pointer-events: auto;
      display: grid;
      gap: 9px;
      padding: 14px;
      border-radius: 24px;
    }
    .drawer.compact .place-card {
      align-self: end;
      max-width: 430px;
      margin-left: auto;
      padding: 10px 12px;
      border-radius: 19px;
    }
    .drawer.compact .quick,
    .drawer.compact .dish {
      display: none;
    }
    .drawer.compact .rail {
      display: none;
    }
    .drawer.compact .place-head h2 {
      font-size: 16px;
      max-width: 14em;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .place-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .place-head h2 { margin: 0; font-size: 21px; line-height: 1.1; letter-spacing: 0; }
    .nav {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      color: #fff;
      background: var(--red);
      font-size: 12px;
      font-weight: 950;
    }
    .toggle {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 0;
      border-radius: 999px;
      color: #25313e;
      background: #edf2f7;
      font-size: 12px;
      font-weight: 950;
    }
    .quick {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }
    .quick div {
      min-height: 50px;
      padding: 8px;
      border-radius: 15px;
      background: #fff8ec;
      border: 1px solid var(--line);
    }
    .quick b { display: block; font-size: 11px; }
    .quick span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 720; }
    .dish { margin: 0; color: #4d5968; font-size: 13px; font-weight: 720; }
    .rail {
      pointer-events: auto;
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .rail::-webkit-scrollbar { display: none; }
    .mini {
      flex: 0 0 142px;
      min-height: 76px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 18px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 10px 24px rgba(31,41,51,.13);
      text-align: left;
    }
    .mini b { display: block; font-size: 13px; line-height: 1.15; }
    .mini span { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; font-weight: 760; }

    .timeline {
      position: fixed;
      z-index: 44;
      left: 50%;
      top: 178px;
      transform: translateX(-50%);
      width: min(100%, 900px);
      display: none;
      gap: 8px;
      overflow-x: auto;
      padding: 0 62px 0 12px;
      scrollbar-width: none;
      pointer-events: none;
    }
    .timeline.active { display: flex; }
    .timeline::-webkit-scrollbar { display: none; }
    .day {
      pointer-events: auto;
      flex: 0 0 166px;
      min-height: 78px;
      padding: 10px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.78);
      background: rgba(255,255,255,.82);
      box-shadow: 0 8px 22px rgba(31,41,51,.12);
    }
    .day time { display: block; color: var(--red); font-size: 12px; font-weight: 950; }
    .day b { display: block; margin-top: 3px; font-size: 13px; }
    .day span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 720; }
    .zoomctl {
      position: fixed;
      z-index: 46;
      right: max(12px, calc((100vw - 900px) / 2 + 12px));
      top: 178px;
      display: grid;
      gap: 6px;
      pointer-events: auto;
    }
    .zoomctl button,
    .zoom-badge {
      width: 42px;
      min-height: 38px;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 15px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 8px 22px rgba(31,41,51,.14);
      color: #25313e;
      font-size: 18px;
      font-weight: 950;
    }
    .zoom-badge {
      display: grid;
      place-items: center;
      width: auto;
      min-width: 42px;
      padding: 0 8px;
      color: #fff;
      background: #25313e;
      font-size: 10px;
      writing-mode: vertical-rl;
      letter-spacing: 0;
    }
    .pin.zoom-hidden { display: none; }

    @media (min-width: 760px) {
      .hero-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .map { min-height: 900px; }
      .filters { top: 134px; }
      .pin { --w: 164px; }
    }
    @media (max-width: 420px) {
      .phone { min-height: 100svh; }
      .map { min-height: 100svh; }
      .trip-head {
        display: grid;
        align-items: flex-start;
        grid-template-columns: 1fr;
        padding: 9px 10px;
        border-radius: 20px;
      }
      .trip-title b { font-size: 15px; }
      .trip-title span { font-size: 10px; }
      .flight-mini {
        justify-content: flex-start;
      }
      .flight-mini span {
        padding: 4px 6px;
        font-size: 9px;
        white-space: normal;
      }
      .tabs { gap: 4px; padding: 4px; border-radius: 16px; }
      .tab { height: 36px; font-size: 12px; border-radius: 12px; }
      .filters {
        top: 124px;
        padding: 0 64px 10px 10px;
        gap: 8px;
      }
      .filter {
        min-height: 36px;
        padding: 0 13px;
        font-size: 12px;
        border-radius: 13px;
      }
      .timeline { top: 166px; padding-right: 54px; }
      .zoomctl {
        top: 166px;
        right: 8px;
      }
      .zoomctl button,
      .zoom-badge {
        width: 38px;
        min-height: 34px;
        border-radius: 13px;
      }
      .day { flex-basis: 148px; min-height: 72px; padding: 9px; }
      .pin {
        width: min(var(--w, 138px), 34vw);
        min-height: 40px;
        grid-template-columns: 25px minmax(0,1fr);
        gap: 5px;
        padding: 6px;
        border-radius: 15px;
      }
      .pin .icon {
        width: 25px;
        height: 25px;
        border-radius: 10px;
        font-size: 14px;
      }
      .pin b { font-size: 11px; }
      .pin span { font-size: 9px; }
      .pin.anchor {
        width: min(var(--w, 128px), 38vw);
        min-height: 42px;
      }
      .pin.dot {
        width: 38px;
        min-height: 38px;
        padding: 6px;
      }
      .pin.dot.active,
      .pin.dot.anchor {
        width: min(var(--w, 136px), 38vw);
      }
      .route::after { font-size: 9px; }
      .label { font-size: clamp(22px, 12vw, 44px); opacity: .82; }
      .drawer { width: calc(100% - 16px); bottom: max(8px, env(safe-area-inset-bottom)); }
      .place-card {
        max-height: 34svh;
        overflow: auto;
        padding: 12px;
        border-radius: 22px;
      }
      .place-head h2 { font-size: 18px; }
      .drawer.compact .place-card {
        max-height: none;
        padding: 9px 10px;
        max-width: 300px;
      }
      .nav { padding: 6px 9px; font-size: 11px; }
      .quick {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .quick div { min-height: 44px; padding: 7px; }
      .quick b, .quick span { font-size: 10px; }
      .dish { font-size: 12px; }
      .mini {
        flex-basis: 128px;
        min-height: 68px;
        padding: 9px;
        border-radius: 16px;
      }
      .mini b { font-size: 12px; }
      .mini span { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <section class="map">
      <div class="road major" style="--x:4%;--y:33%;--w:86%;--r:-7deg"></div>
      <div class="road major" style="--x:16%;--y:58%;--w:62%;--r:15deg"></div>
      <div class="road" style="--x:2%;--y:72%;--w:92%;--r:24deg"></div>
      <div class="road" style="--x:12%;--y:20%;--w:72%;--r:27deg"></div>
      <div class="road" style="--x:68%;--y:18%;--w:8px;--h:74%;--r:5deg"></div>
      <div class="metro" data-name="5号线" style="--x:12%;--y:38%;--w:76%;--r:-6deg;--c:#d9373c"></div>
      <div class="metro" data-name="1号线" style="--x:18%;--y:55%;--w:58%;--r:13deg;--c:#f2c230"></div>
      <div class="metro" data-name="广佛/顺德方向" style="--x:27%;--y:78%;--w:65%;--r:19deg;--c:#179b72"></div>
      <div class="route" data-label="9.5 11:15落地 → 酒店约45-60min" style="--x:55%;--y:17%;--w:27%;--r:129deg"></div>
      <div class="route" data-label="酒店 → 广州南 约45-60min" style="--x:48%;--y:42%;--w:42%;--r:132deg"></div>
      <div class="route" data-label="酒店 → 北京路 约15-25min" style="--x:43%;--y:43%;--w:26%;--r:126deg"></div>
      <div class="route" data-label="酒店 → 体育西/天河 约20-30min" style="--x:54%;--y:41%;--w:29%;--r:40deg"></div>
      <div class="route" data-label="广州南 → 大良 约35-50min" style="--x:24%;--y:77%;--w:50%;--r:-38deg"></div>

      <div class="layer" id="layer-hotel">
        <div class="label" style="--x:30%;--y:24%;--r:-8deg">越秀</div>
        <div class="label" style="--x:78%;--y:69%;--r:-7deg">珠江新城</div>
      </div>
      <div class="layer active" id="layer-guangzhou">
        <div class="label" style="--x:32%;--y:24%;--r:-8deg">越秀</div>
        <div class="label" style="--x:26%;--y:67%;--r:10deg">北京路</div>
        <div class="label" style="--x:31%;--y:88%;--r:11deg">上下九</div>
        <div class="label" style="--x:15%;--y:78%;--r:-10deg">圣心</div>
        <div class="label" style="--x:78%;--y:73%;--r:-7deg">天河</div>
        <div class="label" style="--x:77%;--y:58%;--r:7deg">体育西</div>
      </div>
      <div class="layer" id="layer-shunde">
        <div class="label" style="--x:34%;--y:74%;--r:18deg">广州南</div>
        <div class="label" style="--x:72%;--y:37%;--r:-5deg">大良</div>
        <div class="label" style="--x:38%;--y:50%;--r:8deg">金榜街</div>
      </div>
    </section>

    <div class="topbar">
      <div class="trip-head glass">
        <div class="trip-title"><b>广州顺德食行地图</b><span>德安丽舍凯宾斯基 · 9.5-9.9</span></div>
        <div class="flight-mini"><span>9.5 CZ3596 08:50→11:15</span><span>9.9 MU5330 17:30→20:05</span></div>
      </div>
      <div class="tabs glass">
        <button class="tab active" data-mode="guangzhou">广州大地图</button>
        <button class="tab" data-mode="shunde">顺德本味</button>
      </div>
    </div>

    <div class="filters" id="filters"></div>
    <div class="zoomctl" id="zoomctl" aria-label="地图缩放">
      <button type="button" data-zoom-step="1" aria-label="显示更多地点">+</button>

    const zoomLabels = { 1: "城市", 2: "街区", 3: "小店" };

    function categoryName(type) {
      return {hotel:"酒店", transport:"交通", mall:"天河/商场", tea:"早茶粤菜", snack:"小吃甜品", delivery:"外卖夜宵", dessert:"甜品冰室", meal:"顺德正餐", sight:"老城地标"}[type] || type;
    }

    function zoomFor(place) {
      const [type, , name] = place;
      if (place[14]) return 1;
      if (type === "transport" || type === "mall" || type === "sight") return 2;
      if (type === "delivery" && mode === "hotel") return 2;
      if (type === "tea" || type === "meal") return 2;
      const anchorNames = ["百花传统甜品", "南信牛奶甜品专家", "顺记冰室", "民信老铺", "金榜欢记牛乳"];
      return anchorNames.includes(name) ? 2 : 3;
    }

    function renderFilters() {
      filterBox.innerHTML = filters[mode].map(([type, text]) => `<button class="filter ${type === activeFilter ? "active" : ""}" data-type="${type}" style="--active-color:${type === "all" ? "#25313e" : colors[type]}">${text}</button>`).join("");
    }

    function renderPins() {
      document.querySelectorAll(".pin").forEach((pin) => pin.remove());
      currentPlaces = [...anchors, ...layers[mode]];
      currentPlaces.forEach((place, index) => {
        const [type, icon, name, area, distance, dish, note, url, x, y, w] = place;
        const pin = document.createElement("button");
        const isAnchor = Boolean(place[14]);
        pin.className = `pin ${type === "hotel" ? "hotel" : ""} ${isAnchor ? "anchor" : ""}`;
        pin.dataset.index = index;
        pin.dataset.type = type;
        pin.dataset.zoom = zoomFor(place);
        pin.dataset.anchor = isAnchor ? "true" : "false";
        pin.style.cssText = `--x:${x}%;--y:${y}%;--w:${w}px;--c:${colors[type]}`;
        pin.innerHTML = `<span class="icon">${icon}</span><span><b>${name}</b><span>${area} · ${dish}</span></span>`;
        pin.addEventListener("click", () => selectPlace(index));
        map.appendChild(pin);
      });
      applyFilter();
      selectFirstVisible();
    }

    function selectPlace(index) {
      const place = currentPlaces[index];
      const [type, icon, name, area, distance, dish, note, url,,,, hours, rest, crowd] = place;
      const openHours = hours || "以高德/大众点评当日显示为准";
      const restRisk = rest || "连锁/商场店低风险；小店周一和临休需确认";
      const queue = crowd || "饭点中等，热门店周末偏高";
      document.querySelectorAll(".pin").forEach((pin) => pin.classList.toggle("active", Number(pin.dataset.index) === index));
      card.innerHTML = `<div class="place-head"><h2>${icon} ${name}</h2><div><button class="toggle" type="button">${drawer.classList.contains("compact") ? "展开" : "收起"}</button> <a class="nav" href="${url}" target="_blank" rel="noreferrer">导航</a></div></div>
        <div class="quick">
          <div><b>片区</b><span>${area}</span></div>
          <div><b>场景</b><span>${distance}</span></div>
          <div><b>分类</b><span>${categoryName(type)}</span></div>
          <div><b>营业</b><span>${openHours}</span></div>
          <div><b>周一</b><span>${restRisk}</span></div>
          <div><b>排队</b><span>${queue}</span></div>
        </div>
        <p class="dish"><b>${dish}</b>｜${note}</p>`;
      card.querySelector(".toggle").addEventListener("click", () => {
        drawer.classList.toggle("compact");
        card.querySelector(".toggle").textContent = drawer.classList.contains("compact") ? "展开" : "收起";
      });
      rail.innerHTML = currentPlaces.map((item, i) => `<button class="mini" data-index="${i}"><b>${item[1]} ${item[2]}</b><span>${item[5]}</span></button>`).join("");
      rail.querySelectorAll(".mini").forEach((btn) => btn.addEventListener("click", () => selectPlace(Number(btn.dataset.index))));
    }

    function selectFirstVisible() {
      const visible = [...document.querySelectorAll(".pin")].find((pin) => pin.dataset.anchor !== "true" && !pin.classList.contains("zoom-hidden") && !pin.classList.contains("filter-hidden"))
        || [...document.querySelectorAll(".pin")].find((pin) => !pin.classList.contains("zoom-hidden") && !pin.classList.contains("filter-hidden"))
        || [...document.querySelectorAll(".pin")].find((pin) => !pin.classList.contains("zoom-hidden"));
      if (visible) selectPlace(Number(visible.dataset.index));
    }

    function applyFilter() {
      zoomBadge.textContent = zoomLabels[zoomLevel];
      map.dataset.zoom = zoomLevel;
      document.querySelectorAll(".pin").forEach((pin) => {
        const isAnchor = pin.dataset.anchor === "true";
        pin.classList.toggle("zoom-hidden", !isAnchor && Number(pin.dataset.zoom) > zoomLevel);
        pin.classList.toggle("filter-hidden", !isAnchor && activeFilter !== "all" && pin.dataset.type !== activeFilter);
        pin.classList.toggle("dot", !isAnchor && zoomLevel === 3 && activeFilter === "all");
      });
    }

    zoomBox.addEventListener("click", (event) => {
      const btn = event.target.closest("button");
      if (!btn) return;
      if (btn.dataset.zoomReset !== undefined) zoomLevel = 2;
      else zoomLevel = Math.min(3, Math.max(1, zoomLevel + Number(btn.dataset.zoomStep || 0)));
      applyFilter();
      selectFirstVisible();
    });

    filterBox.addEventListener("click", (event) => {
      const btn = event.target.closest(".filter");
      if (!btn) return;
      activeFilter = btn.dataset.type;
      renderFilters();
      applyFilter();
      selectFirstVisible();
    });

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        mode = tab.dataset.mode;
        activeFilter = "all";
        document.querySelectorAll(".tab").forEach((item) => item.classList.toggle("active", item === tab));
        document.querySelectorAll(".layer").forEach((layer) => layer.classList.toggle("active", layer.id === `layer-${mode}`));
        timeline.classList.toggle("active", mode === "guangzhou");
        history.replaceState(null, "", "#" + mode);
        renderFilters();
        renderPins();
      });
    });

    const initial = location.hash.replace("#", "") === "hotel" ? "guangzhou" : location.hash.replace("#", "");
    const target = [...document.querySelectorAll(".tab")].find((tab) => tab.dataset.mode === initial);
    if (target) target.click();
    else { renderFilters(); renderPins(); }
  </script>
</body>
</html>
